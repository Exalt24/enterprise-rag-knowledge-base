[pytest]
# Only tests/ is collected. backend/test_setup.py is a script that starts Ollama, Qdrant and a RAG call at import
# time and calls exit(1) on failure, so collecting it errors the whole run; that is why CI once dropped pytest.
# The four files ignored below talk to a running backend (HTTP on :8001) or to Qdrant and an LLM, so they cannot
# run on a CI runner. CI names its targets explicitly as well (see .github/workflows/ci.yml); this keeps a bare
# `pytest` from backend/ honest too.
testpaths = tests
pythonpath = .
addopts =
    --ignore=test_setup.py
    --ignore=tests/test_api.py
    --ignore=tests/test_rate_limiting.py
    --ignore=tests/test_ingestion.py
    --ignore=tests/test_rag.py
    --ignore=tests/test_rag_evaluation.py
    --ignore=tests/eval_retrieval.py
