name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # advanced_retrieval imports sentence-transformers (torch) unless RENDER is set; CI installs no torch and
      # the evaluation never reranks, so it runs the same way the slim Render image does.
      RENDER: "true"
    defaults:
      run:
        working-directory: "backend"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci.txt
            backend/requirements-render.txt
            backend/requirements-mcp.txt
            backend/requirements-hatchet.txt
      # requirements-ci.txt is the Render set plus pytest: no torch and no CUDA wheels, so the install stays far
      # inside the 15 minute timeout. requirements.txt is a Windows pip freeze that pulls the CUDA torch wheel.
      - name: Install
        run: |
          start=$(date +%s)
          pip install -r requirements-ci.txt
          echo "pip install took $(( $(date +%s) - start )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
      # The MCP SDK sits on top of the same install. It needs Python 3.11 or newer; this job runs 3.12.
      - name: Install MCP SDK
        run: |
          start=$(date +%s)
          pip install -r requirements-mcp.txt
          echo "MCP SDK install took $(( $(date +%s) - start )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
      # The Hatchet SDK is only imported by app/workflows/ingest.py; the task definition tests and the mutants that break
      # them need it. The archive rules themselves (pipeline.py, archive_guard.py) run without it.
      - name: Install Hatchet SDK
        run: |
          start=$(date +%s)
          pip install -r requirements-hatchet.txt
          echo "Hatchet SDK install took $(( $(date +%s) - start )) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
      # Pinned test files only. The other files in tests/ need a running backend on :8001 or Qdrant and an LLM,
      # and backend/test_setup.py is a script that starts services at import and calls exit(1); a bare
      # `pytest` collects all of them and errors, which is why this step used to be dropped. pytest.ini
      # ignores them too, so a local `pytest` in backend/ behaves the same.
      #
      # Two invocations on purpose: test_hybrid_ranking.py replaces modules that fail to import with stubs for
      # the whole process, and the evaluation must run against the real ones.
      - name: Ranking test (stubbed modules)
        run: python -m pytest tests/test_hybrid_ranking.py
      # A glob, so a new evaluation test file is run without anyone remembering to list it (the shell expands it).
      - name: Evaluation tests
        run: python -m pytest tests/test_eval_*.py
      # The MCP server: in-process tool tests, the generated tool x failure table, and the real process over stdio;
      # then the skill's written scenarios replayed against the server. None of them needs Qdrant, a model download or
      # a language model key. Its own invocation, like the others.
      - name: MCP server and skill tests
        run: python -m pytest tests/test_mcp_server*.py tests/test_skill_*.py
      # The Vertex AI provider against a stand-in server written from the saved Google pages (docs/vendor-contract/vertex-ai/):
      # request shape, signed assertion, token cache and refresh, retries, blocked replies, streaming. Needs no key and no
      # network. Then the same tests run against copies of the code with one guard removed at a time; every copy must fail.
      - name: Vertex AI provider tests
        run: python -m pytest tests/test_vertex_provider.py
      - name: Vertex AI provider mutation check
        run: python eval/vertex_mutation_check.py
      # The Excel loader: every workbook is built by the test itself, so nothing needs a file, Qdrant or a model. The
      # mutation check below breaks the loader one guard at a time and runs this file against each copy.
      - name: Document parser tests
        run: python -m pytest tests/test_document_parser_*.py
      # Archive ingestion and the reviewer source view: every guard of the zip check, the rules of the run (idempotency,
      # a rerun after a crash, one bad file not stopping the rest, retries only for outages), the two archive routes, the
      # chunk lookup, and the Hatchet task definitions through the SDK's mock_run. The in-memory index and the hashing
      # embedder stand in for Qdrant and the model; nothing here needs Docker or a network. Its own invocation.
      - name: Archive ingestion and source view tests
        run: python -m pytest tests/test_archive_guard.py tests/test_archive_pipeline.py tests/test_archive_api.py tests/test_source_view.py tests/test_hatchet_tasks.py
      - name: Deterministic evaluation check
        run: python eval/run_eval.py --check
      # The ingestion mutants run in their own job below, so this one keeps its old length.
      - name: Mutation check
        run: python eval/mutation_check.py --skip-ingest
  ingestion-mutation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER: "true"
    defaults:
      run:
        working-directory: "backend"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci.txt
            backend/requirements-render.txt
            backend/requirements-hatchet.txt
      - name: Install
        run: pip install -r requirements-ci.txt -r requirements-hatchet.txt
      # Breaks each guard of the archive zip check, the archive rules, the status files, the chunk lookup, the two archive
      # routes and the Hatchet task settings, one at a time, in a copy of the code, and requires a test failure for every
      # one. Last line: "N of N mutants caught".
      - name: Ingestion mutation check
        run: python eval/mutation_check.py --only-ingest
  hatchet-integration:
    # Real hatchet-lite, Postgres and Qdrant containers and a real worker container, driven through docker compose.
    # ubuntu only, on every push to main and every pull request, as the other jobs. The test builds the worker image
    # and waits out two retry backoffs, so it takes a few minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "backend"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci.txt
            backend/requirements-hatchet.txt
      - name: Install
        run: pip install -r requirements-ci.txt -r requirements-hatchet.txt
      - name: Hatchet ingestion against hatchet-lite
        env:
          RENDER: "true"
        run: python -m pytest -m hatchet tests/test_hatchet_integration.py -v
      - name: Container logs after a failure
        if: failure()
        run: cat hatchet-integration-logs.txt || true
  source-view-e2e:
    # The reviewer source view in a real browser: the real front end and the real API over the demo corpus.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install the backend
        run: pip install -r backend/requirements-ci.txt
        env:
          RENDER: "true"
      - name: Install the front end and the browser
        working-directory: "frontend"
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Source view test
        working-directory: "frontend"
        env:
          RENDER: "true"
          E2E_PYTHON: python
        run: npx playwright test
  node-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "frontend"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
